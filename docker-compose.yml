version: "3"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - rps-data:/app/data
    environment:
      - NODE_ENV=production

  frontend:
    build: ./frontend
    container_name: rps-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  rps-data:
