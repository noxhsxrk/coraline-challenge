# ============================================================
# API Gateway + Load Balancer Configuration
# ============================================================

# Rate limiting zones (anti-cheat / anti-spam)
limit_req_zone $binary_remote_addr zone=game:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=global:10m rate=60r/m;

# Limit connections per IP (prevent abuse)
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

# Backend pool — supports docker-compose --scale
upstream backend_pool {
    server backend:3001;
    # Docker DNS resolves "backend" to all replicas when scaled:
    #   docker-compose up -d --scale backend=3
    # nginx will round-robin across all backend instances
}

upstream backend_ws {
    server backend:3001;
    # WebSocket needs ip_hash for sticky sessions:
    # ip_hash;
}

server {
    listen 80;
    server_name _;

    # Limit connections per client
    limit_conn per_ip 20;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (no rate limit on static files)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------
    # Health check endpoint (for UptimeRobot, etc.)
    # -------------------------------------------------------
    location /api/health {
        limit_req zone=global burst=60;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------
    # Game API — rate limited (anti-cheat: preventing rapid plays)
    # -------------------------------------------------------
    location /api/game/ {
        limit_req zone=game burst=5 nodelay;
        limit_conn per_ip 10;

        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------
    # Score API — less restrictive
    # -------------------------------------------------------
    location /api/score {
        limit_req zone=global burst=60;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------
    # WebSocket — for real-time high score updates
    # -------------------------------------------------------
    location /socket.io/ {
        limit_conn per_ip 5;

        proxy_pass http://backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
